<!DOCTYPE HTML>
<html>
<head>
    <title>SONALIKA</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
        table { width: 100%; border-collapse: collapse; }

        th, td {
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        td {
            transition: background-color 0.6s ease, transform 0.2s ease;
        }

        td:hover { transform: scale(1.05); }

        .top { box-shadow: 0 0 15px rgba(120,200,140,0.6); }
        .weak { box-shadow: 0 0 15px rgba(220,110,110,0.6); }

        /* 🔥 LOADER */
        #loader {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #7dd3fc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin: auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 🔥 PROGRESS BAR */
        .progress-container {
            width: 80%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            margin: 15px auto;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #7dd3fc;
            transition: width 0.3s ease;
        }
    </style>
</head>

<body class="is-preload">

<div id="wrapper">

<header id="header">
    <div class="logo"><span class="icon fa-gem"></span></div>
    <div class="content">
        <div class="inner">
            <h1>SONALIKA</h1>
            <p>Sector Strength Dashboard 🚀</p>
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="#intro">Intro</a></li>
            <li><a href="#work">Work</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<div id="main">

<!-- INTRO -->
<article id="intro">
    <h2 class="major">Sector EMA Strength</h2>

    <!-- 🔥 LOADER -->
    <div id="loader">
        <div class="spinner"></div>
        <p id="loadingText" style="color:white;">Initializing...</p>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <table id="emaTable" style="display:none;">
        <tr>
            <th>Sector</th>
            <th>EMA20</th>
            <th>EMA50</th>
            <th>EMA100</th>
            <th>EMA200</th>
        </tr>
    </table>
</article>

<!-- WORK -->
<article id="work">
    <h2 class="major">Work</h2>
    <p>Market breadth analyzer using EMA logic.</p>
</article>

<!-- ABOUT -->
<article id="about">
    <h2 class="major">About</h2>
    <p>Uses Yahoo Finance data. No API limits.</p>
</article>

<!-- CONTACT -->
<article id="contact">
    <h2 class="major">Contact</h2>
    <p>Coming soon...</p>
</article>

</div>

<footer id="footer">
    <p>&copy; SONALIKA</p>
</footer>

</div>

<div id="bg"></div>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/browser.min.js"></script>
<script src="assets/js/breakpoints.min.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/main.js"></script>

<script>

// 🔥 SECTORS
const sectors = {
    "IT": ["TCS","INFY","WIPRO","HCLTECH"],
    "Banking": ["HDFCBANK","ICICIBANK","SBIN","AXISBANK"],
    "Auto": ["TATAMOTORS","MARUTI","M&M"],
    "FMCG": ["HINDUNILVR","ITC","NESTLEIND"],
    "Pharma": ["SUNPHARMA","DRREDDY"]
};

// FETCH
async function getStockData(symbol) {
    try {
        const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}.NS`;
        let res = await fetch(url);
        let data = await res.json();

        if (!data.chart || !data.chart.result) return [];

        let prices = data.chart.result[0].indicators.quote[0].close;

        return prices.filter(p => p !== null).slice(-120);
    } catch {
        return [];
    }
}

// EMA
function calculateEMA(prices, period) {
    let k = 2 / (period + 1);
    let ema = prices[0];
    for (let i = 1; i < prices.length; i++) {
        ema = prices[i] * k + ema * (1 - k);
    }
    return ema;
}

// 🎨 COLOR
function getGradientColor(value) {
    const red={r:220,g:110,b:110}, yellow={r:230,g:200,b:120}, green={r:120,g:200,b:140};
    let r,g,b;

    if(value<50){
        let t=value/50;
        r=red.r+(yellow.r-red.r)*t;
        g=red.g+(yellow.g-red.g)*t;
        b=red.b+(yellow.b-red.b)*t;
    } else {
        let t=(value-50)/50;
        r=yellow.r+(green.r-yellow.r)*t;
        g=yellow.g+(green.g-yellow.g)*t;
        b=yellow.b+(green.b-yellow.b)*t;
    }

    return `rgb(${r|0},${g|0},${b|0})`;
}

// MAIN
setTimeout(async () => {

    let table = document.getElementById("emaTable");
    let progressBar = document.getElementById("progressBar");
    let loadingText = document.getElementById("loadingText");

    let sectorKeys = Object.keys(sectors);
    let results = [];

    for (let i = 0; i < sectorKeys.length; i++) {

        let sector = sectorKeys[i];
        loadingText.innerText = "Loading " + sector + "...";

        let stocks = sectors[sector];
        let valid = 0, c20=0,c50=0,c100=0,c200=0;

        for (let symbol of stocks) {

            await new Promise(r => setTimeout(r, 200));

            let prices = await getStockData(symbol);
            if (prices.length < 50) continue;

            valid++;
            let last = prices[prices.length-1];

            if (last > calculateEMA(prices,20)) c20++;
            if (last > calculateEMA(prices,50)) c50++;
            if (last > calculateEMA(prices,100)) c100++;
            if (last > calculateEMA(prices,200)) c200++;
        }

        results.push({
            sector,
            p20: valid?(c20/valid)*100:0,
            p50: valid?(c50/valid)*100:0,
            p100: valid?(c100/valid)*100:0,
            p200: valid?(c200/valid)*100:0
        });

        // 🔥 UPDATE PROGRESS
        let progress = ((i+1)/sectorKeys.length)*100;
        progressBar.style.width = progress + "%";
    }

    loadingText.innerText = "Finalizing...";

    results.sort((a,b)=>b.p20-a.p20);

    results.forEach((r,index)=>{
        let row = table.insertRow();
        row.insertCell(0).innerText = r.sector;

        if(index===0) row.classList.add("top");
        if(index===results.length-1) row.classList.add("weak");

        [r.p20,r.p50,r.p100,r.p200].forEach(v=>{
            let c=row.insertCell(-1);
            c.innerText=v.toFixed(1)+"%";
            c.style.backgroundColor=getGradientColor(v);
        });
    });

    // 🔥 DONE
    document.getElementById("loader").style.display = "none";
    table.style.display = "table";

}, 1000);

</script>

</body>
</html>
