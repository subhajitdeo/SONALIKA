        table { width: 100%; border-collapse: collapse; }

            height: 40px;
            margin: auto;

        @keyframes spin {

            border-radius: 10px;
            overflow: hidden;
        }

            width: 0%;
            background: #7dd3fc;
            transition: width 0.3s ease;
        }

<script>
function getGradientColor(value) {
    const red={r:220,g:110,b:110}, yellow={r:230,g:200,b:120}, green={r:120,g:200,b:140};
    let r,g,b;
    if(value<50){ let t=value/50; r=red.r+(yellow.r-red.r)*t; g=red.g+(yellow.g-red.g)*t; b=red.b+(yellow.b-red.b)*t; }
    else{ let t=(value-50)/50; r=yellow.r+(green.r-yellow.r)*t; g=yellow.g+(green.g-yellow.g)*t; b=yellow.b+(green.b-yellow.b)*t; }
    return `rgb(${r|0},${g|0},${b|0})`;
}

async function loadEMA() {
    let table = document.getElementById("emaTable");
    let progressBar = document.getElementById("progressBar");
    let loadingText = document.getElementById("loadingText");

    table.style.display = "none";
    document.getElementById("loader").style.display = "block";

    let res = await fetch("/api/ema");
    let results = await res.json();

    table.innerHTML = `<tr>
        <th>Sector</th><th>EMA20</th><th>EMA50</th><th>EMA100</th><th>EMA200</th>
    </tr>`;

    results.forEach((r,index)=>{
        let row = table.insertRow();
        row.insertCell(0).innerText = r.sector;
        if(index===0) row.classList.add("top");
        if(index===results.length-1) row.classList.add("weak");
        [r.p20,r.p50,r.p100,r.p200].forEach(v=>{
            let c=row.insertCell(-1);
            c.innerText=v.toFixed(1)+"%";
            c.style.backgroundColor=getGradientColor(v);
        });
        progressBar.style.width = ((index+1)/results.length*100) + "%";
        loadingText.innerText = `Loading ${r.sector}...`;
    });

    document.getElementById("loader").style.display = "none";
    table.style.display = "table";
}

// Refresh every 1 min to get latest backend data
loadEMA();
setInterval(loadEMA, 60000);
</script>
