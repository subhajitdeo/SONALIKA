<button onclick="updateEMAs()">Update EMA</button>
<table id="emaTable">
    <tr>
        <th>Sector</th>
        <th>EMA20</th>
        <th>EMA50</th>
        <th>EMA100</th>
        <th>EMA200</th>
    </tr>
</table>

<script>
function getGradientColor(value) {
    const red={r:220,g:110,b:110}, yellow={r:230,g:200,b:120}, green={r:120,g:200,b:140};
    let r,g,b;

    if(value<50){
        let t=value/50;
        r=red.r+(yellow.r-red.r)*t;
        g=red.g+(yellow.g-red.g)*t;
        b=red.b+(yellow.b-red.b)*t;
    } else {
        let t=(value-50)/50;
        r=yellow.r+(green.r-yellow.r)*t;
        g=yellow.g+(green.g-yellow.g)*t;
        b=yellow.b+(green.b-yellow.b)*t;
    }
    return `rgb(${r|0},${g|0},${b|0})`;
}

async function updateEMAs() {
    const table = document.getElementById("emaTable");

    // Only remove old rows except header
    while(table.rows.length > 1) table.deleteRow(1);

    try {
        const data = [
            {sector:"Technology", p20:65, p50:40, p100:75, p200:55},
            {sector:"Finance", p20:45, p50:60, p100:50, p200:35},
            {sector:"Healthcare", p20:30, p50:25, p100:50, p200:60},
            {sector:"Energy", p20:55, p50:50, p100:45, p200:70}
        ];

        data.forEach(r=>{
            const row = table.insertRow();
            row.insertCell(0).innerText = r.sector;
            [r.p20,r.p50,r.p100,r.p200].forEach(v=>{
                const c = row.insertCell(-1);
                c.innerText = v.toFixed(1) + "%";
                c.style.backgroundColor = getGradientColor(v);
            });
        });
    } catch(e) {
        console.error(e);
    }
}

// Auto-update on page load
updateEMAs();
</script>
