<!DOCTYPE HTML>
<html>
<head>
    <title>SONALIKA</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        td {
            transition: background-color 0.3s ease;
        }
    </style>
</head>

<body class="is-preload">

<div id="wrapper">

<header id="header">
    <div class="logo"><span class="icon fa-gem"></span></div>
    <div class="content">
        <div class="inner">
            <h1>SONALIKA</h1>
            <p>Live Sector EMA Dashboard 🚀</p>
        </div>
    </div>
    <nav>
        <ul>
            <li><a href="#intro">Intro</a></li>
        </ul>
    </nav>
</header>

<div id="main">

<article id="intro">
    <h2 class="major">Live EMA Dashboard</h2>

    <p style="color:white;">Loading data... ⏳</p>

    <table id="emaTable" border="1">
        <tr>
            <th>Sector</th>
            <th>EMA20</th>
            <th>EMA50</th>
            <th>EMA100</th>
            <th>EMA200</th>
        </tr>
    </table>
</article>

</div>

<footer id="footer">
    <p>&copy; SONALIKA</p>
</footer>

</div>

<div id="bg"></div>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/browser.min.js"></script>
<script src="assets/js/breakpoints.min.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/main.js"></script>

<script>

// 🔑 PUT YOUR API KEY HERE
const API_KEY = "AKYTKEESWTXW2PGZ";

// 📊 SECTORS (start small)
const sectors = {
    "IT": ["TCS"],
    "Banking": ["HDFCBANK"]
};

// 🔥 FETCH DATA
async function getStockData(symbol) {

    try {
        const url = `https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${symbol}&apikey=${API_KEY}`;
        let res = await fetch(url);
        let data = await res.json();

        let series = data["Time Series (Daily)"];
        if (!series) return [];

        let prices = Object.values(series)
            .slice(0, 50)
            .map(day => parseFloat(day["4. close"]));

        return prices.reverse();

    } catch (err) {
        console.log("Error:", symbol);
        return [];
    }
}

// EMA
function calculateEMA(prices, period) {
    let k = 2 / (period + 1);
    let ema = prices[0];
    for (let i = 1; i < prices.length; i++) {
        ema = prices[i] * k + ema * (1 - k);
    }
    return ema;
}

// Color
function getGradientColor(value) {
    let r, g;
    if (value < 50) {
        r = 255;
        g = Math.round(5.1 * value);
    } else {
        g = 255;
        r = Math.round(255 - (value - 50) * 5.1);
    }
    return `rgb(${r}, ${g}, 0)`;
}

// MAIN
setTimeout(async () => {

    let table = document.getElementById("emaTable");
    let results = [];

    for (let sector in sectors) {

        let stocks = sectors[sector];
        let total = stocks.length;

        let c20=0,c50=0,c100=0,c200=0;

        for (let symbol of stocks) {

            let prices = await getStockData(symbol);

            if (prices.length === 0) continue;

            let last = prices[prices.length-1];

            if (last > calculateEMA(prices,20)) c20++;
            if (last > calculateEMA(prices,50)) c50++;
            if (last > calculateEMA(prices,100)) c100++;
            if (last > calculateEMA(prices,200)) c200++;
        }

        results.push({
            sector,
            p20:(c20/total)*100,
            p50:(c50/total)*100,
            p100:(c100/total)*100,
            p200:(c200/total)*100
        });
    }

    results.sort((a,b)=>b.p20-a.p20);

    results.forEach(r=>{
        let row = table.insertRow();
        row.insertCell(0).innerText = r.sector;

        [r.p20,r.p50,r.p100,r.p200].forEach(v=>{
            let c=row.insertCell(-1);
            c.innerText=v.toFixed(1)+"%";
            c.style.backgroundColor=getGradientColor(v);
        });
    });

}, 1000);

</script>

</body>
</html>
