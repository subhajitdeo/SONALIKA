<!DOCTYPE HTML>
<html>
<head>
    <title>SONALIKA</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: center; font-weight: bold; }
        td { transition: background-color 0.6s ease, transform 0.2s ease; }
        td:hover { transform: scale(1.05); }
        .top { box-shadow: 0 0 15px rgba(120,200,140,0.6); }
        .weak { box-shadow: 0 0 15px rgba(220,110,110,0.6); }

        /* 🔥 LOADER */
        #loader { text-align: center; padding: 20px; display:none; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #7dd3fc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin: auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 🔥 PROGRESS BAR */
        .progress-container {
            width: 80%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            margin: 15px auto;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #7dd3fc;
            transition: width 0.3s ease;
        }

        /* Update button styling */
        #updateBtn {
            display: block;
            margin: 20px auto;
            padding: 10px 25px;
            background: #7dd3fc;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        #updateBtn:hover { transform: scale(1.05); }
    </style>
</head>
<body class="is-preload">

<div id="wrapper">

<header id="header">
    <div class="logo"><span class="icon fa-gem"></span></div>
    <div class="content">
        <div class="inner">
            <h1>SONALIKA</h1>
            <p>Sector Strength Dashboard 🚀</p>
        </div>
    </div>
</header>

<div id="main">

<article id="intro">
    <h2 class="major">Sector EMA Strength</h2>

    <button id="updateBtn">Update EMA</button>

    <div id="loader">
        <div class="spinner"></div>
        <p id="loadingText" style="color:white;">Fetching data...</p>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <table id="emaTable">
        <tr>
            <th>Sector</th>
            <th>EMA20</th>
            <th>EMA50</th>
            <th>EMA100</th>
            <th>EMA200</th>
        </tr>
    </table>
</article>

</div>

<footer id="footer">
    <p>&copy; SONALIKA</p>
</footer>
</div>

<script>
const sectors = [
    "IT","Banking","Auto","FMCG","Pharma","Energy","Metal","Infra","Telecom","Finance","Power"
];

// Gradient color function
function getGradientColor(value) {
    const red={r:220,g:110,b:110}, yellow={r:230,g:200,b:120}, green={r:120,g:200,b:140};
    let r,g,b;
    if(value<50){
        let t=value/50;
        r=red.r+(yellow.r-red.r)*t;
        g=red.g+(yellow.g-red.g)*t;
        b=red.b+(yellow.b-red.b)*t;
    } else {
        let t=(value-50)/50;
        r=yellow.r+(green.r-yellow.r)*t;
        g=yellow.g+(green.g-yellow.g)*t;
        b=yellow.b+(green.b-yellow.b)*t;
    }
    return `rgb(${r|0},${g|0},${b|0})`;
}

// Main function to update EMA
async function updateEMAs() {
    const loader = document.getElementById("loader");
    const loadingText = document.getElementById("loadingText");
    const progressBar = document.getElementById("progressBar");
    const table = document.getElementById("emaTable");

    loader.style.display = "block";
    table.style.display = "none";

    progressBar.style.width = "0%";
    loadingText.innerText = "Fetching data...";

    try {
        const res = await fetch("http://localhost:5000/update-ema"); // Replace with your backend URL on Render
        const data = await res.json();

        // Reset table
        table.innerHTML = `<tr>
            <th>Sector</th><th>EMA20</th><th>EMA50</th><th>EMA100</th><th>EMA200</th>
        </tr>`;

        data.forEach((r, index)=>{
            loadingText.innerText = `Updating ${r.sector}...`;
            let row = table.insertRow();
            row.insertCell(0).innerText = r.sector;

            if(index===0) row.classList.add("top");
            if(index===data.length-1) row.classList.add("weak");

            [r.p20,r.p50,r.p100,r.p200].forEach(v=>{
                let c=row.insertCell(-1);
                c.innerText = v.toFixed(1)+"%";
                c.style.backgroundColor = getGradientColor(v);
            });

            // Update progress
            progressBar.style.width = ((index+1)/data.length*100) + "%";
        });

    } catch(err){
        loadingText.innerText = "Error fetching data!";
        console.error(err);
    }

    loader.style.display = "none";
    table.style.display = "table";
}

// Button click
document.getElementById("updateBtn").addEventListener("click", updateEMAs);

</script>

</body>
</html>
