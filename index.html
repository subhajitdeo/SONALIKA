            <th>Sector</th>

<script>
// Dummy Data (you can expand later)
const data = {
    "IT": {
        "TCS": [4500,4550,4600,4650,4700],
        "Infosys": [1500,1520,1530,1510,1540]
    },
    "Banking": {
        "HDFC": [1600,1620,1610,1630,1650],
        "ICICI": [800,810,805,815,820]
    }
};

// EMA
function calculateEMA(prices, period) {
    let k = 2 / (period + 1);
    let ema = [prices[0]];
    for (let i = 1; i < prices.length; i++) {
        ema.push(prices[i] * k + ema[i - 1] * (1 - k));
    }
    return ema;
}

// Gradient Color
function getGradientColor(value) {
    let r, g;

    if (value < 50) {
        r = 255;
        g = Math.round(5.1 * value);
    } else {
        g = 255;
        r = Math.round(255 - (value - 50) * 5.1);
    }

    return `rgb(${r}, ${g}, 0)`;
}

let table = document.getElementById("emaTable");

for (let sector in data) {

    let stocks = data[sector];
    let total = Object.keys(stocks).length;

    let count20 = 0, count50 = 0, count100 = 0, count200 = 0;

    for (let stock in stocks) {
        let prices = stocks[stock];
        let last = prices[prices.length - 1];

        if (last > calculateEMA(prices,20).slice(-1)[0]) count20++;
        if (last > calculateEMA(prices,50).slice(-1)[0]) count50++;
        if (last > calculateEMA(prices,100).slice(-1)[0]) count100++;
        if (last > calculateEMA(prices,200).slice(-1)[0]) count200++;
    }

    let p20 = (count20 / total) * 100;
    let p50 = (count50 / total) * 100;
    let p100 = (count100 / total) * 100;
    let p200 = (count200 / total) * 100;

    let row = table.insertRow();
    row.insertCell(0).innerText = sector;

    function addCell(val) {
        let c = row.insertCell(-1);
        c.innerText = val.toFixed(2) + "%";
        c.style.backgroundColor = getGradientColor(val);
    }

    addCell(p20);
    addCell(p50);
    addCell(p100);
    addCell(p200);
}
</script>
