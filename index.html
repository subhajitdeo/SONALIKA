<!-- EMA SCRIPT -->
<script>
const data = {
    "IT": {
        "TCS": [4500, 4550, 4600, 4650, 4700],
        "Infosys": [1500, 1520, 1530, 1510, 1540]
    },
    "Banking": {
        "HDFC": [1600, 1620, 1610, 1630, 1650],
        "ICICI": [800, 810, 805, 815, 820]
    }
};

function calculateEMA(prices, period) {
    let k = 2 / (period + 1);
    let ema = [prices[0]];
    for (let i = 1; i < prices.length; i++) {
        ema.push(prices[i] * k + ema[i - 1] * (1 - k));
    }
    return ema;
}

function percentAboveEMA(prices, ema) {
    let count = prices.filter((p, i) => p > ema[i]).length;
    return ((count / prices.length) * 100).toFixed(2);
}

let table = document.getElementById("emaTable");

for (let sector in data) {
    for (let stock in data[sector]) {
        let prices = data[sector][stock];

        let ema20 = calculateEMA(prices, 20);
        let ema50 = calculateEMA(prices, 50);
        let ema100 = calculateEMA(prices, 100);
        let ema200 = calculateEMA(prices, 200);

        let row = table.insertRow();
        row.insertCell(0).innerText = sector;
        row.insertCell(1).innerText = stock;
        row.insertCell(2).innerText = percentAboveEMA(prices, ema20) + "%";
        row.insertCell(3).innerText = percentAboveEMA(prices, ema50) + "%";
        row.insertCell(4).innerText = percentAboveEMA(prices, ema100) + "%";
        row.insertCell(5).innerText = percentAboveEMA(prices, ema200) + "%";
    }
}
</script>
