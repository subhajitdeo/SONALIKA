    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
        table { width: 100%; border-collapse: collapse; }

        th, td {
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        td {
            transition: background-color 0.6s ease, transform 0.2s ease;
        }

        td:hover { transform: scale(1.05); }

        .top { box-shadow: 0 0 15px rgba(120,200,140,0.6); }
        .weak { box-shadow: 0 0 15px rgba(220,110,110,0.6); }

        /* LOADER */
        #loader {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #7dd3fc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin: auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* PROGRESS BAR */
        .progress-container {
            width: 80%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            margin: 15px auto;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #7dd3fc;
            transition: width 0.3s ease;
        }
    </style>
</head>
