<!DOCTYPE HTML>
<html>
<head>
    <title>SONALIKA</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        td {
            transition: background-color 0.3s ease;
        }
    </style>
</head>

<body class="is-preload">

<div id="wrapper">

<header id="header">
    <div class="logo">
        <span class="icon fa-gem"></span>
    </div>
    <div class="content">
        <div class="inner">
            <h1>SONALIKA</h1>
            <p>Sector Strength Dashboard 🚀</p>
        </div>
    </div>
    <nav>
        <ul>
            <li><a href="#intro">Intro</a></li>
        </ul>
    </nav>
</header>

<div id="main">

<article id="intro">
    <h2 class="major">Sector EMA Strength</h2>

    <!-- DEBUG TEXT (remove later if you want) -->
    <p style="color:white;">Dashboard Loaded ✅</p>

    <table id="emaTable" border="1">
        <tr>
            <th>Sector</th>
            <th>EMA20</th>
            <th>EMA50</th>
            <th>EMA100</th>
            <th>EMA200</th>
        </tr>
    </table>
</article>

</div>

<footer id="footer">
    <p>&copy; SONALIKA</p>
</footer>

</div>

<div id="bg"></div>

<!-- IMPORTANT: keep ALL template scripts -->
<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/browser.min.js"></script>
<script src="assets/js/breakpoints.min.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/main.js"></script>

<script>

// 🔥 DATA
const data = {
    "IT": {
        "TCS": [4500,4550,4600,4650,4700],
        "Infosys": [1500,1520,1530,1510,1540]
    },
    "Banking": {
        "HDFC": [1600,1620,1610,1630,1650],
        "ICICI": [800,810,805,815,820]
    }
};

// 🔥 EMA FUNCTION
function calculateEMA(prices, period) {
    let k = 2 / (period + 1);
    let ema = prices[0];

    for (let i = 1; i < prices.length; i++) {
        ema = prices[i] * k + ema * (1 - k);
    }

    return ema;
}

// 🔥 COLOR GRADIENT
function getGradientColor(value) {
    let r, g;

    if (value < 50) {
        r = 255;
        g = Math.round(5.1 * value);
    } else {
        g = 255;
        r = Math.round(255 - (value - 50) * 5.1);
    }

    return `rgb(${r}, ${g}, 0)`;
}

// 🔥 SAFE RUN AFTER TEMPLATE LOAD
setTimeout(function () {

    let table = document.getElementById("emaTable");
    if (!table) return;

    let sectorResults = [];

    for (let sector in data) {

        let stocks = data[sector];
        let total = Object.keys(stocks).length;

        let count20 = 0, count50 = 0, count100 = 0, count200 = 0;

        for (let stock in stocks) {
            let prices = stocks[stock];
            let last = prices[prices.length - 1];

            let ema20 = calculateEMA(prices,20);
            let ema50 = calculateEMA(prices,50);
            let ema100 = calculateEMA(prices,100);
            let ema200 = calculateEMA(prices,200);

            if (last > ema20) count20++;
            if (last > ema50) count50++;
            if (last > ema100) count100++;
            if (last > ema200) count200++;
        }

        sectorResults.push({
            sector,
            p20: (count20/total)*100,
            p50: (count50/total)*100,
            p100: (count100/total)*100,
            p200: (count200/total)*100
        });
    }

    // 🔥 SORT
    sectorResults.sort((a,b)=> b.p20 - a.p20);

    // 🔥 RENDER
    sectorResults.forEach(item => {

        let row = table.insertRow();
        row.insertCell(0).innerText = item.sector;

        function add(val) {
            let c = row.insertCell(-1);
            c.innerText = val.toFixed(1) + "%";
            c.style.backgroundColor = getGradientColor(val);
        }

        add(item.p20);
        add(item.p50);
        add(item.p100);
        add(item.p200);
    });

}, 300); // delay fixes template conflict

</script>

</body>
</html>
