<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EMA Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ccc;
        }
        th {
            background: #333;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

<h2>Sector EMA Dashboard</h2>
<button onclick="updateEMAs()">Update EMA</button>

<table id="emaTable">
    <tr>
        <th>Sector</th>
        <th>EMA20</th>
        <th>EMA50</th>
        <th>EMA100</th>
        <th>EMA200</th>
    </tr>
</table>

<script>
function getGradientColor(value) {
    const red={r:220,g:110,b:110}, yellow={r:230,g:200,b:120}, green={r:120,g:200,b:140};
    let r,g,b;

    if(value<50){
        let t=value/50;
        r=red.r+(yellow.r-red.r)*t;
        g=red.g+(yellow.g-red.g)*t;
        b=red.b+(yellow.b-red.b)*t;
    } else {
        let t=(value-50)/50;
        r=yellow.r+(green.r-yellow.r)*t;
        g=yellow.g+(green.g-yellow.g)*t;
        b=yellow.b+(green.b-yellow.b)*t;
    }
    return `rgb(${r|0},${g|0},${b|0})`;
}

async function updateEMAs() {
    const table = document.getElementById("emaTable");
    table.innerHTML = `<tr>
        <th>Sector</th><th>EMA20</th><th>EMA50</th><th>EMA100</th><th>EMA200</th>
    </tr>`;

    try {
        // ⚡ Dummy data for testing
        const data = [
            {sector:"Technology", p20:65, p50:40, p100:75, p200:55},
            {sector:"Finance", p20:45, p50:60, p100:50, p200:35},
            {sector:"Healthcare", p20:30, p50:25, p100:50, p200:60},
            {sector:"Energy", p20:55, p50:50, p100:45, p200:70}
        ];

        // Uncomment below to fetch from your backend
        // const res = await fetch("http://localhost:5000/update-ema");
        // if(!res.ok) throw new Error("Network response not ok");
        // const data = await res.json();

        data.forEach(r=>{
            const row = table.insertRow();
            row.insertCell(0).innerText = r.sector;
            [r.p20,r.p50,r.p100,r.p200].forEach(v=>{
                const c = row.insertCell(-1);
                c.innerText = v.toFixed(1) + "%";
                c.style.backgroundColor = getGradientColor(v);
            });
        });
    } catch(e) {
        console.error("Failed to update EMAs:", e);
        alert("Failed to update EMAs: " + e.message);
    }
}

// Auto-update on page load
updateEMAs();
</script>

</body>
</html>
